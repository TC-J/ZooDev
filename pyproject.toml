[project]
name = "zoo-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "plumbum>=2.0.2",
    "scapy>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
# This ensures all files inside the resources folder are copied to site-packages
"zoo_dev.resources" = ["*"]

